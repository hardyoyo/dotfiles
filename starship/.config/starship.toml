# SOURCES
# https://starship.rs/config
# https://starship.rs/presets/nerd-font.html#configuration

# DEBUG via:
# starship explain
# STARSHIP_LOG=trace

"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for commands executed by starship (ms)
command_timeout = 2000

# newline between commands
add_newline = true

[username]
style_user = 'black bold'
style_root = 'red bold'
format = '\[[$user]($style)'
disabled = false
show_always = true

[hostname]
ssh_only = false
format = '[@](white)[$hostname](bold yellow)\] '
trim_at = '.escholarship.org'
disabled = false

[character]
success_symbol = '[＄](bold green)'
# success_symbol = '[💲](bold green)'
error_symbol = '[✗](bold red)'

[custom.vpn]
command = "echo  \" 🔒 \" "
when = "/Users/hpottinger/bin/vpn-status.sh"
format = '\[[$output]($style)\]'

[directory]
fish_style_pwd_dir_length=1

[aws]
format = '\[[🅰️ ($profile)(\($region\))(\[$duration\])]($style)✨\]'

[bun]
format = '\[[$symbol($version)]($style)\]'

[c]
format = '\[[$symbol($version(-$name))]($style)\]'

[cmake]
format = '\[[$symbol($version)]($style)\]'

[cmd_duration]
format = '\[[⏱ $duration]($style)\]'

[cobol]
format = '\[[$symbol($version)]($style)\]'

[conda]
