# ~/.tmuxinator/my-dancecard.yml

name: my-dancecard
root: ~
# pre_window: rvm use ruby-2.4.2
windows:
  - radar:
      layout: main-vertical
      panes:
        - echo ------------------- MY RADAR ------------------- && echo && /opt/homebrew/bin/icalBuddy -eep 'notes,location' -df '%a %b-%d-%Y (%RD)' -sd -t -nc -n -nrd -sed eventsToday+7
        - echo -----------TRELLO - dev current work------------ && echo && trellotool card list todo | grep hardy_cdl | awk -F '\|' '{print $3, $7"#"substr($3,match($3,"PUBD-[0-9]+"),RLENGTH)}'|sed -r 's/ #/\//g' && echo && echo ---------------TRELLO - up next----------------- && echo && trellotool card list "Up Next" | awk -F '\|' '{print $3, $7"#"substr($3,match($3,"PUBD-[0-9]+"),RLENGTH)}'|sed -r 's/ #/\//g'|sed -r 's/\/$//g'|tail -n6 && echo && echo ---------------TRELLO - new -------------------- && echo && trellotool card list "New Since Last Check-in" | awk -F '\|' '{print $3, $7"#"substr($3,match($3,"PUBD-[0-9]+"),RLENGTH)}'|sed -r 's/ #/\//g'|sed -r 's/\/$//g' && echo && echo ---------------TRELLO - backlog----------------- && echo && trellotool card list 60523683a26f1a2b2456d42f | grep hardy_cdl | awk -F '\|' '{print $3, $7"#"substr($3,match($3,"PUBD-[0-9]+"),RLENGTH)}'|sed -r 's/ #/\//g' && echo && echo -------------- Janeway Latest Tag -------------- && printf "$(/opt/homebrew/bin/gh api repos/BirkbeckCTP/janeway/tags | /opt/homebrew/bin/jq '.[0].name' | /usr/bin/tr -d \")\n" && echo && rich --markdown --width 45 ~/.step-goals && echo && echo ----------------- Can\'t Wait\! ------------------ && days_until.py /Users/hpotting/.event_list.txt && echo
