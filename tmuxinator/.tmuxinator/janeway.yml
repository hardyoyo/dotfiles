# ~/.tmuxinator/janeway.yml

name: janeway
root: ~/workspace/janeway
windows:
  - dev_servers:
      layout: main-vertical
      panes:
        - python3 src/manage.py runserver
        - brew services start postgresql@14 && tail -f /opt/homebrew/var/log/postgresql@14.log
  - code:
      layout: main-vertical
      panes:
        - echo "#run vim . if you don't know what else to do (though code . works better)"

